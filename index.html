<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3ddc84">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Plan My Day</title>

  <link id="bootstrap-theme-css" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/build-number.js"></script>
</head>

<body>

  <!-- FIXED TOOLBAR -->
  <nav id="mainNav" class="navbar navbar-expand px-3 py-2 gap-1 flex-wrap">

    <button id="btnSettings" class="btn p-1 me-1" onclick="openSettings()" title="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
        <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
      </svg>
    </button>

    <div class="dropdown">
      <button id="btnEditMenu" class="btn btn-sm dropdown-toggle" data-bs-toggle="dropdown">Edit</button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" onclick="openStreamsEditor()">Jobs</a></li>
        <li><button type="button" class="dropdown-item" onclick="openSearchJobs()">Search Jobs</button></li>
        <li><a class="dropdown-item" onclick="openImagesEditor()">Images</a></li>
      </ul>
    </div>
    <div class="dropdown">
      <button id="btnImportExport" class="btn btn-sm dropdown-toggle" data-bs-toggle="dropdown">Import/Export</button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" onclick="exportData()">Export</a></li>
        <li><a class="dropdown-item" onclick="importData()">Import</a></li>
        <li><hr class="dropdown-divider minio-menu-item" style="display:none"></li>
        <li><a class="dropdown-item minio-menu-item" style="display:none" onclick="exportToMinio()">Export to Minio</a></li>
        <li><a class="dropdown-item minio-menu-item" style="display:none" onclick="importFromMinio()">Import from Minio</a></li>
      </ul>
    </div>

  </nav>

  <!-- MAIN CONTENT -->
  <div class="container-fluid px-3">

    <div id="countdownContainer"></div>

    <!-- JOBS EDITOR -->
    <smd-page id="streamsEditor" class="d-none"></smd-page>

    <!-- JOB SEARCH -->
    <smd-page id="jobSearchEditor" class="d-none"></smd-page>

    <!-- IMAGES EDITOR -->
    <div id="imagesEditor" class="d-none">
      <div id="imagesEditorHeader">
        <h2 class="mb-3">Edit Images</h2>
        <div id="addImageTileTop" class="mb-3"></div>
        <div id="imageFilters" class="mb-3"></div>
      </div>
      <div id="imagesList"></div>
      <div id="addImageTile" class="mt-3"></div>
      <div id="singleImageEditor" class="d-none"></div>
    </div>

    <!-- IMAGE PICKER MODAL (Bootstrap modal) -->
    <div id="imagePickerModal" class="modal fade" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-lg-down">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title">Choose Image</h3>
            <button id="btnImagePickerClose" type="button" class="btn-close" onclick="closeImagePicker()"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3 d-flex gap-2">
              <input class="form-control image-picker-search" type="search" placeholder="Search images by name..." oninput="filterImagePicker(this.value)">
              <button id="btnImagePickerClear" class="btn btn-outline-secondary" onclick="clearImagePickerFilter()">Clear</button>
            </div>
            <div class="image-picker-list d-flex flex-wrap" style="gap:8px;min-height:120px"></div>
          </div>
          <div class="modal-footer">
            <button id="btnImagePickerNoImage" class="btn btn-secondary" onclick="selectImagePickerItem(null)">No Image</button>
            <button id="btnImagePickerCancel" class="btn btn-outline-secondary" onclick="closeImagePicker()">Cancel</button>
          </div>
        </div>
      </div>
    </div>

<!-- SETTINGS PAGE -->
  <smd-page id="settingsPage" class="d-none"></smd-page>

  <!-- JOB VIEW/EDIT/ADD PAGE -->
  <smd-page id="jobEditPage" class="d-none"></smd-page>
  <template id="settingsTemplate">
      <div class="smd-settings">

        <!-- General -->
        <section class="smd-settings-tab" data-tab="General" data-tab-id="general-tab">
          <div class="row mb-4 align-items-center col-md-8 mt-3">
            <div class="col-4 text-end"><label class="form-label mb-0">Split list</label></div>
            <div class="col-8">
              <div class="form-check form-switch mt-1">
                <input id="splitList" class="form-check-input" type="checkbox" onchange="changeSplitList(this.checked)">
              </div>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Auto-hide menu</label></div>
            <div class="col-8">
              <div class="form-check form-switch mt-1">
                <input id="autoHideMenu" class="form-check-input" type="checkbox" onchange="changeAutoHideMenu(this.checked)">
              </div>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Hide done</label></div>
            <div class="col-8">
              <div class="form-check form-switch mt-1">
                <input id="hideDone" class="form-check-input" type="checkbox" onchange="changeHideDone(this.checked)">
              </div>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Auto Ad Hoc</label></div>
            <div class="col-8">
              <div class="form-check form-switch mt-1">
                <input id="skipAdhocConfirm" class="form-check-input" type="checkbox" onchange="changeSkipAdhocConfirm(this.checked)">
              </div>
            </div>
          </div>
        </section>

        <!-- Appearance -->
        <section class="smd-settings-tab" data-tab="Display" data-tab-id="appearance-tab">
          <div class="row mb-3 align-items-center col-md-8 mt-3">
            <div class="col-4 text-end"><label class="form-label mb-0">Theme</label></div>
            <div class="col-8">
              <select id="themeSelector" class="form-select" onchange="changeTheme(this.value)">
                <option value="cerulean">Cerulean (light)</option>
                <option value="cosmo">Cosmo (light)</option>
                <option value="cyborg">Cyborg (dark)</option>
                <option value="darkly" selected>Darkly (dark)</option>
                <option value="flatly">Flatly (light)</option>
                <option value="journal">Journal (light)</option>
                <option value="litera">Litera (light)</option>
                <option value="lumen">Lumen (light)</option>
                <option value="lux">Lux (light)</option>
                <option value="materia">Materia (light)</option>
                <option value="minty">Minty (light)</option>
                <option value="morph">Morph (light)</option>
                <option value="pulse">Pulse (light)</option>
                <option value="quartz">Quartz (light)</option>
                <option value="sandstone">Sandstone (light)</option>
                <option value="simplex">Simplex (light)</option>
                <option value="sketchy">Sketchy (light)</option>
                <option value="slate">Slate (dark)</option>
                <option value="solar">Solar (dark)</option>
                <option value="spacelab">Spacelab (light)</option>
                <option value="superhero">Superhero (dark)</option>
                <option value="united">United (light)</option>
                <option value="vapor">Vapor (dark)</option>
                <option value="yeti">Yeti (light)</option>
                <option value="zephyr">Zephyr (light)</option>
              </select>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Font size</label></div>
            <div class="col-8">
              <select id="fontSizeSelector" class="form-select" onchange="changeFontSize(this.value)">
                <option value="xsmall">Extra small</option>
                <option value="small">Small</option>
                <option value="normal">Normal</option>
                <option value="large">Large</option>
                <option value="xlarge">Extra large</option>
                <option value="jumbo">Jumbo</option>
              </select>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Icon size</label></div>
            <div class="col-8">
              <select id="iconSizeSelector" class="form-select" onchange="changeIconSize(this.value)">
                <option value="small">Small (64x64)</option>
                <option value="medium">Medium (80x80)</option>
                <option value="large">Large (100x100)</option>
              </select>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Tile density</label></div>
            <div class="col-8">
              <select id="densitySelector" class="form-select" onchange="changeDensity(this.value)">
                <option value="normal">Normal</option>
                <option value="compact">Compact</option>
              </select>
            </div>
          </div>
          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Drag size</label></div>
            <div class="col-8">
              <select id="dragSizeSelector" class="form-select" onchange="changeDragSize(this.value)">
                <option value="normal">Normal</option>
                <option value="large">Large</option>
              </select>
            </div>
          </div>
          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Slide speed</label></div>
            <div class="col-8">
              <select id="slideDurationSelector" class="form-select" onchange="changeSlideDuration(this.value)">
                <option value="0">Off (instant)</option>
                <option value="150">Fast (150 ms)</option>
                <option value="300">Normal (300 ms)</option>
                <option value="500">Slow (500 ms)</option>
              </select>
            </div>
          </div>
          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Screen resolution</label></div>
            <div class="col-8">
              <span id="screenResolution" class="form-control-plaintext"></span>
            </div>
          </div>
        </section>

        <!-- Schedule -->
        <section class="smd-settings-tab" data-tab="Schedule" data-tab-id="schedule-tab">
          <div class="row mb-4 align-items-center col-md-8 mt-3">
            <div class="col-4 text-end"><label class="form-label mb-0">Suffix start</label></div>
            <div class="col-8">
              <select id="suffixStartSelector" class="form-select" onchange="changeSuffixStart(this.value)">
                <option value="0">0</option>
                <option value="1">1</option>
              </select>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">1 Jan</label></div>
            <div class="col-8">
              <select id="jan1Selector" class="form-select" onchange="changeJan1(this.value)">
                <option value="1">1</option>
                <option value="0">0</option>
              </select>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Monday #</label></div>
            <div class="col-8">
              <select id="mondaySelector" class="form-select" onchange="changeMonday(this.value)">
                <option value="1">1</option>
                <option value="0">0</option>
              </select>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Start week</label></div>
            <div class="col-8">
              <select id="startWeekSelector" class="form-select" onchange="changeStartWeek(this.value)">
                <option value="1">Mon</option>
                <option value="2">Tue</option>
                <option value="3">Wed</option>
                <option value="4">Thu</option>
                <option value="5">Fri</option>
                <option value="6">Sat</option>
                <option value="0">Sun</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Minio -->
        <section class="smd-settings-tab" data-tab="Minio" data-tab-id="minio-tab">
          <div class="row mb-4 align-items-center col-md-8 mt-3">
            <div class="col-4 text-end"><label class="form-label mb-0">Enable</label></div>
            <div class="col-8">
              <div class="form-check form-switch mt-1">
                <input id="minioEnabled" class="form-check-input" type="checkbox" onchange="changeMinioEnabled(this.checked)">
              </div>
            </div>
          </div>
          <div id="minioFields">
            <div class="row mb-4 align-items-center col-md-8">
              <div class="col-4 text-end"><label class="form-label mb-0">Server</label></div>
              <div class="col-8">
                <input id="minioServer" class="form-control" type="text" placeholder="http://localhost:9000" onchange="changeMinioServer(this.value)">
              </div>
            </div>
            <div class="row mb-4 align-items-center col-md-8">
              <div class="col-4 text-end"><label class="form-label mb-0">Username</label></div>
              <div class="col-8">
                <input id="minioUsername" class="form-control" type="text" onchange="changeMinioUsername(this.value)">
              </div>
            </div>
            <div class="row mb-4 align-items-center col-md-8">
              <div class="col-4 text-end"><label class="form-label mb-0">Password</label></div>
              <div class="col-8">
                <div class="input-group">
                  <input id="minioPassword" class="form-control" type="password" onchange="changeMinioPassword(this.value)">
                  <button class="btn btn-outline-secondary" type="button" onclick="toggleMinioPassword()" title="Show/hide password">
                    <svg id="minioPasswordEye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                      <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                      <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="row mb-4 align-items-center col-md-8">
              <div class="col-4 text-end"><label class="form-label mb-0">Bucket</label></div>
              <div class="col-8">
                <input id="minioBucket" class="form-control" type="text" onchange="changeMinioBucket(this.value)">
              </div>
            </div>
          </div>
        </section>

        <!-- Danger -->
        <section class="smd-settings-tab" data-tab="Danger" data-tab-id="danger-tab">
          <div class="row mb-4 align-items-center col-md-8 mt-3">
            <div class="col-4 text-end"><label class="form-label mb-0">Show danger</label></div>
            <div class="col-8">
              <div class="form-check form-switch mt-1">
                <input id="showDanger" class="form-check-input" type="checkbox" onchange="changeShowDanger(this.checked)">
              </div>
            </div>
          </div>

          <div id="regenerateTilesRow" class="row mb-4 align-items-center col-md-8 d-none">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <button id="btnRegenerateTiles" class="btn btn-primary editor-btn btn-wide w-100" onclick="regenerateTiles()">Regenerate Today's Tiles</button>
            </div>
          </div>

          <div id="sortJobsInStreamsRow" class="row mb-4 align-items-center col-md-8 d-none">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <button id="btnSortJobsInStreams" class="btn btn-primary editor-btn btn-wide w-100" onclick="sortJobsInStreams()">Sort Jobs in Streams</button>
            </div>
          </div>

          <div id="clearAllDataRow" class="row mb-4 align-items-center col-md-8 d-none">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <button id="btnClearAllData" class="btn btn-danger editor-btn btn-wide w-100" onclick="confirmClearAllData()">Clear All Data</button>
            </div>
          </div>
          <div id="refreshAppRow" class="row mb-2 align-items-center col-md-8 d-none">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <button id="btnRefreshApp" class="btn btn-warning editor-btn btn-wide w-100" onclick="location.reload()">Refresh App</button>
            </div>
          </div>
          <div id="uploadStandardImagesRow" class="row mb-2 align-items-center col-md-8 d-none">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <button id="btnUploadImages" class="btn btn-primary editor-btn btn-wide w-100" onclick="uploadStandardImages()">Upload Standard Images</button>
            </div>
          </div>
          <div id="devTodayRow" class="row mb-2 align-items-center col-md-8 d-none">
            <div class="col-4 text-end"><label class="form-label mb-0">Dev Today</label></div>
            <div class="col-8">
              <input class="form-control" id="devTodayInput" placeholder="Pick a date">
            </div>
          </div>
          <div id="devLastGenRow" class="row mb-2 align-items-center col-md-8 d-none">
            <div class="col-4 text-end"><label class="form-label mb-0">Dev Last Gen</label></div>
            <div class="col-8">
              <input class="form-control" id="devLastGenInput" placeholder="Pick a date">
            </div>
          </div>
        </section>

        <div id="settingsFooter" class="mt-3">
          <div class="row align-items-center col-md-8 mb-3">
            <div class="col-4 text-end"></div>
            <div class="col-8">
              <a href="https://buymeacoffee.com/ownimage" target="_blank" rel="noopener">
                <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me A Coffee" style="height:50px">
              </a>
            </div>
          </div>

          <div class="row mb-4 align-items-center col-md-8">
            <div class="col-4 text-end"><label class="form-label mb-0">Share app</label></div>
            <div class="col-8">
              <div id="shareQrCode" style="background:white;padding:10px;display:inline-block;border-radius:8px;"></div>
            </div>
          </div>

          <div class="mt-5 small build-number">Build <span id="buildNumber"></span></div>
        </div>
      </div>
    </template>
    <!-- hidden sample data for icons, loaded on first visit -->
    <script id="sampleDataScript" type="application/json"></script>

  </div>

  <div id="deleteConfirmModal" class="modal fade" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center pb-0">
          <p class="mb-3 fs-5" id="deleteConfirmMessage">Delete this item?</p>
        </div>
        <div class="modal-footer justify-content-center border-0 pt-2">
          <button id="btnDeleteCancel" class="btn btn-secondary editor-btn flex-fill" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger editor-btn flex-fill" id="deleteConfirmBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div id="infoConfirmModal" class="modal fade" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center pb-0">
          <p class="mb-3 fs-5" id="infoConfirmMessage"></p>
        </div>
        <div class="modal-footer justify-content-center border-0 pt-2">
          <button class="btn btn-primary editor-btn btn-wide" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCHEDULE MODAL -->
  <div id="scheduleModal" class="modal fade" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">Schedule</h3>
          <button id="btnScheduleClose" type="button" class="btn-close" onclick="closeScheduleModal()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="scheduleType" id="schedDaily" value="daily" onchange="onScheduleTypeChange()">
              <label class="form-check-label" for="schedDaily">Every day</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="scheduleType" id="schedNDays" value="ndays" onchange="onScheduleTypeChange()">
              <label class="form-check-label" for="schedNDays">Every n days</label>
            </div>
            <div id="schedNDaysOptions" class="d-none ms-4 mb-2">
              <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                <label class="form-label mb-0">Every</label>
                <select class="form-select" id="schedNInterval" onchange="onScheduleNDaysChange()" style="width:auto;min-width:60px"></select>
                <label class="form-label mb-0">day(s)</label>
                <label class="form-label mb-0 ms-2">Offset</label>
                <select class="form-select" id="schedNOffset" onchange="onScheduleNDaysChange()" style="width:auto;min-width:60px"></select>
              </div>
              <div id="schedNextDue" class="text-muted small"></div>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="scheduleType" id="schedWeekdays" value="weekdays" onchange="onScheduleTypeChange()">
              <label class="form-check-label" for="schedWeekdays">Weekdays (Mon&ndash;Fri)</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="scheduleType" id="schedWeekends" value="weekends" onchange="onScheduleTypeChange()">
              <label class="form-check-label" for="schedWeekends">Weekends (Sat&ndash;Sun)</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="scheduleType" id="schedDays" value="days" onchange="onScheduleTypeChange()">
              <label class="form-check-label" for="schedDays">Specific days</label>
            </div>
            <div id="schedDaysOptions" class="d-none ms-4 mb-2 d-flex gap-2 flex-wrap">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="schedDay0" value="0"><label class="form-check-label" for="schedDay0">Sun</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="schedDay1" value="1"><label class="form-check-label" for="schedDay1">Mon</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="schedDay2" value="2"><label class="form-check-label" for="schedDay2">Tue</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="schedDay3" value="3"><label class="form-check-label" for="schedDay3">Wed</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="schedDay4" value="4"><label class="form-check-label" for="schedDay4">Thu</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="schedDay5" value="5"><label class="form-check-label" for="schedDay5">Fri</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="schedDay6" value="6"><label class="form-check-label" for="schedDay6">Sat</label></div>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="scheduleType" id="schedMonthly" value="monthly" onchange="onScheduleTypeChange()">
              <label class="form-check-label" for="schedMonthly">Day of month</label>
            </div>
            <div id="schedMonthlyOptions" class="d-none ms-4 mb-2">
              <select class="form-select" id="schedMonthlyDay" style="width:auto"></select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnScheduleCancel" class="btn btn-secondary editor-btn flex-fill" onclick="closeScheduleModal()">Cancel</button>
          <button id="btnScheduleOk" class="btn btn-primary editor-btn flex-fill" onclick="saveScheduleModal()">OK</button>
        </div>
      </div>
    </div>
  </div>
